<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日本大学院专业推荐站</title>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>全国国立大学专业目录</h1>
    <p>现在先专注把 85 所国立大学做完整。你只需要搜索专业，就能看到开设相关方向的学校、研究科和专业入口；页面只保留专业信息和官网链接。</p>
  </header>

  <section class="stats">
    <div class="stat">已收录 <strong id="schoolCount">0</strong> / <strong id="schoolTarget">85</strong> 所</div>
    <div class="stat">专业方向 <strong id="directionCount">0</strong> 个</div>
    <div class="stat">官方入口 <strong id="linkCount">0</strong> 个</div>
    <div class="stat">当前范围 <strong id="coverageText">国立大学</strong></div>
  </section>

  <section class="panel">
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="搜索专业：建筑 / 材料 / 电气电子 / 计算机 / AI / 数据科学 / 土木 / 控制 / 化学 / 生物 ..." />
      <button class="primary-btn" id="searchBtn">推荐学校</button>
      <button class="secondary-btn" id="resetBtn">重置</button>
    </div>

    <div class="section-title">院校导航</div>
    <div class="jump-row">
      <button class="secondary-btn" id="jumpToggleBtn" type="button">全部院校</button>
      <div class="jump-panel hidden" id="jumpPanel">
        <div class="jump-panel-head">
          <strong>点击学校跳转</strong>
          <span id="jumpCount">0 所</span>
        </div>
        <div class="jump-list" id="jumpList"></div>
      </div>
    </div>

    <p class="hint">这版先只做国立大学。搜索专业时，会优先返回开设该专业的学校；如果直接搜索学校名，也会展开这所学校当前收录的全部相关专业。</p>
  </section>

  <div class="results-head">
    <h2>推荐结果</h2>
    <span class="badge" id="resultCount">0 所学校</span>
  </div>

  <main class="result-list" id="resultList"></main>
</div>

<script src="assets/index-data.js"></script>
<script src="assets/national-batch-1.js"></script>
<script src="assets/national-batch-2.js"></script>
<script src="assets/national-roster.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
