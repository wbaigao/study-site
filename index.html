<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日本大学院工科与计算机专业目录</title>
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="page">
  <header class="hero">
    <h1>日本大学院工科与计算机专业目录</h1>
    <p>这一版不再硬啃募集要项细节，先把学校、专业方向和官方入口做清楚。你可以先按学校和专业方向快速筛，再从右侧直接跳到官网继续看最新信息。</p>
  </header>

  <section class="stats">
    <div class="stat">学校 <strong id="schoolCount">0</strong> 所</div>
    <div class="stat">方向 <strong id="directionCount">0</strong> 个</div>
    <div class="stat">官方入口 <strong id="linkCount">0</strong> 个</div>
    <div class="stat">范围 <strong>工科 + 计算机</strong></div>
  </section>

  <section class="panel">
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="搜索专业方向：机械 / 材料 / 电气电子 / 计算机 / AI / 数据科学 / 建筑 / 土木 / 半导体" />
      <button class="primary-btn" id="searchBtn">搜索</button>
      <button class="secondary-btn" id="resetBtn">重置</button>
    </div>

    <div class="section-title">快速搜索</div>
    <div class="row" id="quickRow"></div>

    <div class="section-title" style="margin-top:16px;">学校筛选</div>
    <div class="row" id="schoolTabs"></div>

    <p class="hint">点击学校后，会直接显示这所学校目前收录的全部工科和计算机专业方向，不再按研究科拆成多层。</p>
  </section>

  <div class="results-head">
    <h2>学校目录</h2>
    <span class="badge" id="resultCount">0 所</span>
  </div>

  <main class="result-list" id="resultList"></main>
</div>

<script src="assets/index-data.js"></script>
<script src="assets/new-schools-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
